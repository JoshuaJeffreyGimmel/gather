worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/manifest+json
    image/svg+xml;

  upstream gather_api {
    server backend:4000;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded/copied build output can be large-ish; keep bodies small anyway.
    client_max_body_size 1m;

    # The API. Same-origin, so the frontend never needs CORS.
    location /api/ {
      proxy_pass         http://gather_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_read_timeout 30s;

      # The chat polls; responses must never be cached.
      proxy_buffering off;
      add_header Cache-Control "no-store" always;
    }

    # Fingerprinted bundles — safe to cache hard.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Photos and icons change only with a rebuild.
    location ~* ^/(img|icons)/ {
      expires 30d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    # The service worker must always be revalidated, or updates never land.
    location = /sw.js {
      add_header Cache-Control "no-cache, must-revalidate" always;
      try_files $uri =404;
    }

    location = /manifest.webmanifest {
      types { } default_type application/manifest+json;
      add_header Cache-Control "public, max-age=3600" always;
      try_files $uri =404;
    }

    # Single-page app: every unknown path is a client route.
    location / {
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
